frr version 9.1.3
frr defaults traditional
hostname as108r3
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 1.108.1.1/24
!
interface eth1
 ip address 1.108.0.3/31
 ip ospf cost 25
 ip ospf network point-to-point
!
interface eth2
 ip address 1.108.0.4/31
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 ip address 1.108.0.9/31
 ip ospf cost 10
 ip ospf network point-to-point
!
interface dummy0
 ip address 1.108.3.3/32
!
router ospf
 ospf router-id 1.108.3.3
 network 1.108.0.0/20 area 0
 passive-interface eth0
!

