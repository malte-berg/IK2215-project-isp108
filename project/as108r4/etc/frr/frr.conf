frr version 9.1.3
frr defaults traditional
hostname as108r4
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 1.108.2.1/24
!
interface eth1
 ip address 1.108.0.6/31
 ip ospf cost 10
!
interface eth2
 ip address 1.108.0.5/31
 ip ospf cost 10
!
interface dummy0
 ip address 1.108.3.4/32
!
router ospf
 ospf router-id 1.108.3.4
 network 1.108.0.0/20 area 0
 passive-interface eth0
!
