frr version 9.1.3
frr defaults traditional
hostname as108r2
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 2.21.0.1/31
!
interface eth1
 ip address 1.108.0.2/31
 ip ospf cost 25
 ip ospf network point-to-point
!
interface eth2
 ip address 1.108.0.1/31
 ip ospf cost 30
 ip ospf network point-to-point
!
interface dummy0
 ip address 1.108.3.2/32
!
router ospf
 ospf router-id 1.108.3.2
 network 1.108.0.0/20 area 0
 default-information originate always metric 20
 redistribute bgp route-map RMAP_OSPF_AS21
!
#####
##### BGP Configuration
#####
router bgp 108
 no bgp ebgp-requires-policy
 neighbor 2.21.0.0 remote-as 21
 neighbor 2.21.0.0 description AS21
 neighbor 1.108.3.1 remote-as 108
 neighbor 1.108.3.1 description iBGP-r1
 neighbor 1.108.3.1 update-source dummy0
 !
 address-family ipv4 unicast
  network 1.108.3.2/32
  aggregate-address 1.108.0.0/20 summary-only

  neighbor 2.21.0.0 route-map RMAP_IN_AS21 in
  neighbor 2.21.0.0 route-map RMAP_OUT_AS21 out
  neighbor 1.108.3.1 next-hop-self
 exit-address-family
!
ip prefix-list PFX_AS21 seq 10 permit 2.21.0.0/20
ip prefix-list PFX_LOCAL seq 10 permit 1.108.0.0/20
!
route-map RMAP_IN_AS21 permit 10
 match ip address prefix-list PFX_AS21
 set local-preference 300
!
route-map RMAP_IN_AS21 permit 20
!
# Prepend ASN to outgoing advertisements to de-prioritize AS21 as an inbound path
route-map RMAP_OUT_AS21 permit 10
 match ip address prefix-list PFX_LOCAL
 set as-path prepend 108
!
route-map RMAP_OUT_AS21 permit 20
 set as-path prepend 108 108 108
!
route-map RMAP_OSPF_AS21 permit 10
 match ip address prefix-list PFX_AS21
!
